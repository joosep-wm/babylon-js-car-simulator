<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js Car Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="InfoPanel.js"></script>
    <script type="module" src="./index.js"></script>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="app">
        <!-- Info Panel Component -->
        <info-panel
            :speed="speed"
            :position="position"
            :rotation="rotation"
            :direction="direction"
            :collisions="collisions"
            :knocked-boxes="knockedBoxes"
            :max-speed="maxSpeed"
            :race-time="raceTime"
            :finish-time="finishTime"
            :is-racing="isRacing">
        </info-panel>

        <!-- Canvas -->
        <canvas id="renderCanvas"></canvas>

        <!-- Desktop Controls Display -->
        <div class="desktop-controls" :class="{ visible: !isTouchDevice }">
            <div class="control-group">
                <div class="key-display wasd" :class="{ active: keyStates.w }">W</div>
                <div class="key-display wasd" :class="{ active: keyStates.a }">A</div>
                <div class="key-display wasd" :class="{ active: keyStates.s }">S</div>
                <div class="key-display wasd" :class="{ active: keyStates.d }">D</div>
                <span class="control-label">Move</span>
            </div>
            
            <div class="control-separator"></div>
            
            <div class="control-group">
                <div class="key-display space" :class="{ active: keyStates.space }">SPACE</div>
                <span class="control-label">Brake</span>
            </div>
            
            <div class="control-separator"></div>
            
            <div class="control-group">
                <div class="key-display enter" :class="{ active: keyStates.enter }">ENTER</div>
                <span class="control-label">Reset</span>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div class="mobile-controls" :class="{ visible: isTouchDevice }">
            <!-- Virtual Joystick -->
            <div class="virtual-joystick" ref="joystick">
                <div class="joystick-outer">
                    <div class="joystick-inner" ref="joystickInner"></div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <div class="action-button brake" @touchstart="onBrakeStart" @touchend="onBrakeEnd">
                    🚗
                </div>
                <div class="action-button reset" @touchstart="onResetTouch">
                    🔄
                </div>
            </div>
        </div>
    </div>
</body>
</html>
